# Run with prek (https://github.com/j178/prek) or pre-commit:
#   uv tool install prek && prek install && prek run --all-files
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-yaml
    - id: check-toml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-executables-have-shebangs
    # A second net for the App's private key, besides .gitignore and gitleaks.
    - id: detect-private-key

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff-check
      args: ["--fix", "--show-fixes"]
      # bin/ scripts have no .py extension.
      types_or: [python]
    - id: ruff-format
      types_or: [python]

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks

- repo: local
  hooks:
    # The same check the BrainCOGS repos vendor, run from its canonical copy.
    - id: ai-attribution
      name: AI attribution (Assisted-by trailer, no AI authors)
      language: python
      entry: python hooks/check_ai_attribution.py
      stages: [commit-msg]
    - id: tests
      name: check_ai_attribution tests
      language: python
      entry: python -m pytest -q -p no:cacheprovider
      additional_dependencies: [pytest]
      files: ^(hooks|tests)/
      pass_filenames: false
